name: Feature request
description: Propose a focused improvement to the review-before-download workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What decision or recovery step is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible result, not only a control or implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and tradeoffs
      description: Note any effect on privacy, command visibility, format selection, or macOS support.
  - type: checkboxes
    id: fit
    attributes:
      label: Product fit
      options:
        - label: This preserves CueFetch's narrow review-before-download workflow.
          required: true
